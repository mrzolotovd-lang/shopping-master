stages:
  - test
  - lint
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.12"

cache:
  paths:
    - .cache/pip
    - venv/

.before_script: &before_script
  - python --version
  - python -m venv venv
  - source venv/bin/activate
  - pip install --upgrade pip
  - pip install -r requirements.txt
  - pip install -r requirements-dev.txt

test:
  stage: test
  image: python:$PYTHON_VERSION
  before_script:
    - *before_script
  script:
    - pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

lint:
  stage: lint
  image: python:$PYTHON_VERSION
  before_script:
    - *before_script
    - pip install ruff mypy
  script:
    - ruff check src/ tests/
    - ruff format src/ tests/ --check
    - mypy src/ --ignore-missing-imports
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

build:
  stage: build
  image: python:$PYTHON_VERSION
  before_script:
    - *before_script
  script:
    - echo "Building application..."
    - python -m compileall src/
  artifacts:
    paths:
      - src/
      - config/
      - scripts/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy_staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_HOST >> ~/.ssh/known_hosts 2>/dev/null
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to staging..."
    - ssh $STAGING_USER@$STAGING_HOST "cd $STAGING_DIR && git pull && source venv/bin/activate && pip install -r requirements.txt"
  environment:
    name: staging
    url: https://staging.shopping-master.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  when: manual

migrate:
  stage: deploy
  image: python:$PYTHON_VERSION
  before_script:
    - *before_script
  script:
    - echo "Running database migrations..."
    - python scripts/migrate.py
  variables:
    DATABASE_URL: "$DATABASE_URL"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

deploy_production:
  stage: deploy
  image: alpine:latest
  needs: ["migrate"]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 00 ~/.ssh
    - ssh-keyscan $PROD_HOST >> ~/.ssh/known_hosts 2>/dev/null
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to production..."
    - ssh $PROD_USER@$PROD_HOST "cd $PROD_DIR && git pull && source venv/bin/activate && pip install -r requirements.txt"
    - ssh $PROD_USER@$PROD_HOST "systemctl restart shopping-bot"
  environment:
    name: production
    url: https://shopping-master.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual

daily_consumption:
  stage: deploy
  image: python:$PYTHON_VERSION
  variables:
    DATABASE_URL: "$DATABASE_URL"
  before_script:
    - *before_script
  script:
    - echo "Running daily consumption..."
    - python scripts/daily_consumption.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  when: on_success

backup_production:
  stage: deploy
  image: python:$PYTHON_VERSION
  variables:
    S3_BUCKET: "$S3_BUCKET"
    DATABASE_URL: "$DATABASE_URL"
  before_script:
    - *before_script
    - pip install boto3
  script:
    - echo "Creating backup..."
    - python scripts/backup.py
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
  when: manual
